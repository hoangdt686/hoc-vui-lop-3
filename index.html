<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Học vui lớp 3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800;900&display=swap&subset=vietnamese">
</head><body>
<style>
/* Bố cục: một cột trung tâm rộng tối đa 1100px, thanh trên cố định; màn hình trẻ em chữ lớn, nút lớn */
:root {
  --bg: #EEF5FA; --surface: #FFFFFF; --surface2: #F4F8FB; --ink: #1D2939; --muted: #5A6A7E; --line: #D5E1EB;
  --math: #EC6A35; --math-soft: #FFE8DC; --math-ink: #A3401A;
  --tv: #0E9F7A; --tv-soft: #D4F3E8; --tv-ink: #0A6E55;
  --xp: #6A55D6; --xp-soft: #ECE8FF; --star: #F2B200; --star-soft: #FFF4CC;
  --ok: #15803D; --ok-soft: #DCFCE7; --warn: #A15C07; --warn-soft: #FEF3C7; --oops: #C2410C; --oops-soft: #FFEDD5;
  --shadow: 0 2px 0 rgba(29, 41, 57, .08), 0 8px 24px rgba(29, 41, 57, .07);
  --f-display: 'Baloo 2', 'Segoe UI', 'Nunito', system-ui, sans-serif;
  --f-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --r: 18px; --on-accent: #FFFFFF;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1621; --surface: #172230; --surface2: #1E2B3B; --ink: #E7EEF6; --muted: #9DB0C4; --line: #2B3B4E;
  --math: #FF8B5E; --math-soft: #3B2418; --math-ink: #FFB394; --tv: #34D399; --tv-soft: #10342A; --tv-ink: #8AF0C9;
  --xp: #A595FF; --xp-soft: #262046; --star: #FFCC33; --star-soft: #3A3010;
  --ok: #4ADE80; --ok-soft: #12301E; --warn: #FBBF24; --warn-soft: #3A2C0E; --oops: #FB923C; --oops-soft: #3A2414;
  --shadow: 0 2px 0 rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); --on-accent: #0E1621; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1621; --surface: #172230; --surface2: #1E2B3B; --ink: #E7EEF6; --muted: #9DB0C4; --line: #2B3B4E;
  --math: #FF8B5E; --math-soft: #3B2418; --math-ink: #FFB394; --tv: #34D399; --tv-soft: #10342A; --tv-ink: #8AF0C9;
  --xp: #A595FF; --xp-soft: #262046; --star: #FFCC33; --star-soft: #3A3010;
  --ok: #4ADE80; --ok-soft: #12301E; --warn: #FBBF24; --warn-soft: #3A2C0E; --oops: #FB923C; --oops-soft: #3A2414;
  --shadow: 0 2px 0 rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); --on-accent: #0E1621; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
@media (max-width: 520px) { .brand small, .top .iconbtn .small { display: none; } .top .chip { font-size: .85rem; padding: 5px 9px; } }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 18px; line-height: 1.5; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--xp); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; } h2 { font-size: 1.5rem; } h3 { font-size: 1.2rem; }
p { margin: 0; }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main.wrap { padding-block: 20px 60px; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.spacer { flex: 1; }

/* thanh trên */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; gap: 10px; align-items: center; padding-block: 8px; flex-wrap: wrap; }
.brand { display: flex; gap: 8px; align-items: center; background: none; border: 0; padding: 0; }
.brand b { font-family: var(--f-display); font-size: 1.15rem; letter-spacing: .02em; }
.brand small { display: block; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); font-weight: 700; font-size: .95rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.star { background: var(--star-soft); border-color: transparent; }
.chip.xp { background: var(--xp-soft); border-color: transparent; }
.chip.clock { background: var(--tv-soft); border-color: transparent; }
.iconbtn { min-width: 44px; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; font-weight: 700; }

/* nút */
.btn { min-height: 52px; padding: 10px 22px; border-radius: 14px; border: 0; font-weight: 800; font-size: 1.05rem; background: var(--xp); color: var(--on-accent); box-shadow: 0 3px 0 rgba(0, 0, 0, .18); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .18); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--line); box-shadow: none; }
.btn.math { background: var(--math); } .btn.tv { background: var(--tv); }
.btn.ok { background: var(--ok); } .btn.small { min-height: 40px; padding: 6px 14px; font-size: .95rem; }
.btn.big { min-height: 64px; font-size: 1.25rem; padding: 12px 28px; }

/* thẻ */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card h3 { margin-bottom: 8px; }
.eyebrow { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 800; background: var(--surface2); border: 1px solid var(--line); }
.pill.lv-1 { color: var(--muted); } .pill.lv0 { background: var(--oops-soft); color: var(--oops); border-color: transparent; }
.pill.lv1 { background: var(--warn-soft); color: var(--warn); border-color: transparent; } .pill.lv2 { background: var(--xp-soft); color: var(--xp); border-color: transparent; }
.pill.lv3 { background: var(--ok-soft); color: var(--ok); border-color: transparent; } .pill.lv4 { background: var(--star-soft); color: var(--warn); border-color: transparent; }
.bar { height: 12px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--xp); border-radius: 999px; transition: width .4s; }
.bar.math > i { background: var(--math); } .bar.tv > i { background: var(--tv); } .bar.star > i { background: var(--star); }
.note { padding: 12px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--ink); font-size: .95rem; }
.note.info { background: var(--xp-soft); } .note.ok { background: var(--ok-soft); }

/* trang chủ */
.hello { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.hello h1 span { color: var(--xp); }
.bubble { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 12px 16px; position: relative; font-size: 1.05rem; }
.doors { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 640px) { .doors { grid-template-columns: 1fr; } .hello { grid-template-columns: 1fr; justify-items: start; } }
.door { border: 0; border-radius: 26px 26px 18px 18px; padding: 22px; text-align: left; color: #fff; min-height: 170px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; position: relative; overflow: hidden; box-shadow: var(--shadow); }
.door.math { background: linear-gradient(160deg, #F58A4F, #DD5A27); } .door.tv { background: linear-gradient(160deg, #1DB58D, #0B8566); }
.door h2 { font-size: 1.7rem; color: #fff; } .door p { opacity: .95; font-weight: 700; }
.door svg.deco { position: absolute; right: -8px; top: -6px; opacity: .25; }
.door.next { outline: 4px solid var(--star); outline-offset: 3px; }
.mission { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.mission:last-child { border-bottom: 0; }
.tick { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); flex: none; display: grid; place-items: center; }
.tick.on { background: var(--ok); border-color: var(--ok); color: #fff; }

/* bản đồ hành trình */
.region { margin-top: 22px; }
.region-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 10px; }
.path { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; position: relative; }
.node { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 14px 12px; text-align: left; min-height: 120px; display: flex; flex-direction: column; gap: 6px; position: relative; }
.node .no { font-family: var(--f-display); font-size: 1.5rem; line-height: 1; }
.node .t { font-weight: 800; font-size: .98rem; line-height: 1.3; }
.node.done { border-color: var(--ok); background: var(--ok-soft); }
.node.doing { border-color: var(--star); }
.node.locked { opacity: .55; cursor: not-allowed; }
.node.rec::after { content: "Nên học"; position: absolute; top: -10px; right: 10px; background: var(--star); color: #1D2939; font-size: .72rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
.stars { color: var(--star); letter-spacing: 2px; font-size: .95rem; }

/* bài học */
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 18px; }
.step { flex: 1 1 90px; padding: 6px 8px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--line); font-size: .78rem; font-weight: 800; text-align: center; color: var(--muted); }
.step.on { background: var(--xp); color: var(--on-accent); border-color: transparent; }
.step.past { background: var(--xp-soft); color: var(--xp); border-color: transparent; }
.lesson-body { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 18px; align-items: start; }
@media (max-width: 860px) { .lesson-body { grid-template-columns: 1fr; } .tutor-side { order: -1; } }
.tutor-side { position: sticky; top: 80px; }
.src { font-size: .82rem; color: var(--muted); margin-top: 6px; }
.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.gloss div { background: var(--surface2); border-radius: 12px; padding: 10px 12px; border: 1px solid var(--line); }
.gloss b { display: block; color: var(--tv-ink); font-size: 1.05rem; }
.guide li { margin: 6px 0; padding: 10px 12px; background: var(--surface2); border-radius: 12px; list-style: none; border-left: 5px solid var(--xp); }
.guide { padding: 0; margin: 0; }
.guide li.hide { display: none; }

/* câu hỏi */
.q { font-size: 1.3rem; font-weight: 800; line-height: 1.45; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.choices.one { grid-template-columns: 1fr; }
@media (max-width: 560px) { .choices { grid-template-columns: 1fr; } }
.choice { min-height: 60px; padding: 12px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-weight: 800; font-size: 1.12rem; text-align: left; }
.choice:hover:not([disabled]) { border-color: var(--xp); }
.choice.sel { border-color: var(--xp); background: var(--xp-soft); }
.choice.right { border-color: var(--ok); background: var(--ok-soft); }
.choice.wrong { border-color: var(--oops); background: var(--oops-soft); }
.choice[disabled] { cursor: default; }
.numin { font-size: 1.6rem; font-weight: 800; width: 180px; max-width: 100%; text-align: center; padding: 10px; border-radius: 14px; border: 3px solid var(--line); background: var(--surface); font-variant-numeric: tabular-nums; }
.pad { display: grid; grid-template-columns: repeat(6, 52px); gap: 8px; }
@media (max-width: 420px) { .pad { grid-template-columns: repeat(4, 52px); } }
.pad button { height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 800; font-size: 1.2rem; }
.slots { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
.slot { min-height: 48px; border: 2px dashed var(--line); border-radius: 12px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; background: var(--surface2); font-weight: 700; }
.slot b { font-family: var(--f-display); color: var(--xp); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; }
.tok { padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 800; min-height: 48px; }
.tok.sel { border-color: var(--xp); background: var(--xp-soft); }
.tok.used { visibility: hidden; }
.baskets { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 12px; }
.basket { border: 3px dashed var(--line); border-radius: 16px; padding: 12px; min-height: 120px; background: var(--surface2); text-align: left; display: flex; flex-direction: column; gap: 6px; }
.basket h4 { margin: 0; font-family: var(--f-display); font-size: 1.1rem; }
.basket .tok { font-size: .95rem; min-height: 0; padding: 6px 10px; }
.basket.right { border-color: var(--ok); } .basket.wrong { border-color: var(--oops); }
.fb { margin-top: 14px; padding: 14px 16px; border-radius: 14px; font-weight: 700; }
.fb.ok { background: var(--ok-soft); } .fb.oops { background: var(--oops-soft); } .fb.hint { background: var(--star-soft); } .fb.info { background: var(--xp-soft); }
.fb ol { margin: 6px 0 0; padding-left: 22px; font-weight: 600; }
.qhead { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; }
textarea.write { width: 100%; min-height: 160px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); padding: 12px; font-size: 1.15rem; line-height: 1.6; }
.checklist label { display: flex; gap: 10px; align-items: center; padding: 6px 0; font-weight: 700; }
.checklist input { width: 24px; height: 24px; }
.vis { margin-top: 12px; overflow-x: auto; }
.vis svg { max-width: 100%; height: auto; }
.vis svg text { fill: var(--ink); font-family: var(--f-body); }

/* trò chơi */
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.mcard { aspect-ratio: 4/3; border-radius: 14px; border: 0; font-weight: 800; font-size: 1.15rem; background: var(--xp); color: var(--on-accent); max-width: 100%; }
.mcard.open { background: var(--surface); color: var(--ink); border: 2px solid var(--xp); }
.mcard.gone { background: var(--ok-soft); color: var(--ok); border: 2px solid var(--ok); }
.sky { position: relative; height: 380px; border-radius: 18px; background: linear-gradient(180deg, var(--xp-soft), var(--surface2)); overflow: hidden; border: 1px solid var(--line); }
.balloon { position: absolute; width: 120px; min-height: 80px; border-radius: 50% 50% 46% 46%; border: 0; color: #1D2939; font-weight: 800; font-size: .95rem; padding: 10px; display: grid; place-items: center; animation: floaty 4s ease-in-out infinite; box-shadow: inset -6px -8px 0 rgba(0, 0, 0, .08); }
.balloon::after { content: ""; position: absolute; left: 50%; bottom: -26px; width: 1px; height: 26px; background: var(--muted); }
.balloon.popped { animation: pop .3s forwards; }
.balloon.no { animation: shake .4s; }
@keyframes floaty { 50% { transform: translateY(-10px); } }
@keyframes pop { to { transform: scale(1.4); opacity: 0; } }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.track { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; margin: 8px 0 14px; }
.track .cell { height: 54px; border-radius: 10px; background: var(--surface2); border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; color: var(--muted); }
.track .cell.pass { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.track .cell.here { background: var(--star-soft); border-color: var(--star); }
.wheel-box { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 700px) { .wheel-box { grid-template-columns: 1fr; } }
.wheel-wrap { position: relative; width: 280px; height: 280px; max-width: 100%; }
.wheel { width: 100%; height: 100%; transition: transform 2.6s cubic-bezier(.2, .8, .2, 1); }
.wheel-pin { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 26px solid var(--ink); }

/* lớp phủ */
.overlay { position: fixed; inset: 0; background: rgba(15, 23, 34, .55); z-index: 20; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 22px; padding: 24px; max-width: 560px; width: 100%; box-shadow: var(--shadow); max-height: 90vh; overflow: auto; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 800; z-index: 30; max-width: calc(100% - 32px); }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 25; }

/* phụ huynh */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 16px; }
.tab { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; font-size: .95rem; }
.tab.on { background: var(--ink); color: var(--bg); border-color: transparent; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--f-display); font-size: 1.8rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
.field { display: flex; flex-direction: column; gap: 4px; font-weight: 700; }
.field input, .field select, .field textarea { padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 600; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.pinpad { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; justify-content: center; }
.pinpad button { height: 64px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); font-size: 1.5rem; font-weight: 800; }
.dots { display: flex; gap: 12px; justify-content: center; margin: 12px 0; }
.dots i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--xp); }
.dots i.on { background: var(--xp); }
.seg { display: flex; gap: 4px; margin-top: 8px; }
.seg i { flex: 1; height: 10px; border-radius: 4px; background: var(--surface2); border: 1px solid var(--line); }
.seg i.done { background: var(--ok); border-color: transparent; } .seg i.now { background: var(--star); border-color: transparent; }
.memcard { perspective: 800px; min-height: 120px; border: 0; background: none; padding: 0; text-align: left; }
.memcard .in { position: relative; min-height: 120px; transition: transform .5s; transform-style: preserve-3d; }
.memcard.flip .in { transform: rotateY(180deg); }
.memcard .f, .memcard .b { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 16px; padding: 14px; display: flex; align-items: center; font-weight: 800; border: 2px solid var(--line); }
.memcard .f { background: var(--xp-soft); } .memcard .b { background: var(--ok-soft); transform: rotateY(180deg); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Hỏi Cú Bon */
.chatfab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 15; display: flex; align-items: center; gap: 6px; padding: 4px 16px 4px 6px; border-radius: 999px; border: 2px solid var(--xp); background: var(--surface); font-weight: 900; box-shadow: var(--shadow); min-height: 56px; }

/* ---------- Trò chơi Tiếng Việt ---------- */
function gameSpell(key) { const def = SPELL[key]; const items = sample(def.w, 8).map(parseBlank).map(p => Math.random() < .5 ? { t: p.right, ok: true } : { t: pick(p.wrong), ok: false }); if (!items.some(x => x.ok)) items[0] = { t: parseBlank(def.w[0]).right, ok: true }; return { type: 'pop', title: 'Hái những quả bóng có từ viết đúng chính tả', items }; }
function gameGroups(key) { const def = GROUPS[key]; const items = []; def.g.forEach((g, gi) => sample(g[1], def.g.length > 2 ? 3 : 4).forEach(t => items.push({ t, g: gi }))); return { type: 'sort', title: 'Giỏ phân loại: ' + def.name.toLowerCase(), groups: def.g.map(x => x[0]), items: shuffle(items) }; }
function gameFor(skills) {
  for (const s of skills) { const k = s.slice(3); if (SPELL[k]) return gameSpellAny(k); if (GROUPS[k]) return gameGroups(k); }
  if (skills.includes('tv.trainghia')) return { type: 'pairs', title: 'Lật thẻ ghép cặp từ trái nghĩa', pairs: sample(TN, 6) };
  if (skills.includes('tv.nghe')) return { type: 'pairs', title: 'Lật thẻ ghép nghề với công việc', pairs: sample(NGHE, 6) };
  return { type: 'sort', title: 'Giỏ phân loại kiểu câu', groups: KIEU.map(x => x[0]), items: shuffle(KIEU.flatMap((x, gi) => sample(x[1], 2).map(t => ({ t, g: gi })))) };
}
function gameSpellAny(k) { const def = SPELL[k]; const items = sample(def.w, Math.min(8, def.w.length)).map(parseBlank).map(p => Math.random() < .5 ? { t: p.right, ok: true } : { t: pick(p.wrong), ok: false }); if (!items.some(x => x.ok)) { const p = parseBlank(def.w[0]); items[0] = { t: p.right, ok: true }; } return { type: 'pop', title: 'Hái những quả bóng có từ viết đúng chính tả', items }; }
// sửa gameSpellMix để dùng danh sách gộp
function gameSpellMix2(keys) { const all = keys.flatMap(k => SPELL[k].w); const items = sample(all, 8).map(parseBlank).map(p => Math.random() < .5 ? { t: p.right, ok: true } : { t: pick(p.wrong), ok: false }); if (!items.some(x => x.ok)) { const p = parseBlank(all[0]); items[0] = { t: p.right, ok: true }; } return { type: 'pop', title: 'Hái những quả bóng có từ viết đúng chính tả', items }; }
TL.lessons.find(l => l.id === 'v07').game = () => gameSpellMix2(['chtr', 'vd']);
Object.keys(SK).filter(k => k.startsWith('tv.')).forEach(k => { const s = SK[k]; s.cat = s.reading ? 'doc' : s.spell ? 'chinhta' : ['tv.tinnhan', 'tv.thu', 'tv.phieumuon'].includes(k) ? 'viet' : s.kc ? 'kechuyen' : 'tucau'; });

    case 'poly': { const pts = [[10, 80]]; v.segs.forEach((s, i) => { const [x, y] = pts[pts.length - 1]; pts.push([x + 30 + s * 12, i % 2 ? 80 : 20]); }); const nm = 'ABCDEF'; const W = pts[pts.length - 1][0] + 20;
      let s = '<polyline points="' + pts.map(p => p.join(',')).join(' ') + '" fill="none" stroke="var(--xp)" stroke-width="4"/>';

    default: return '';
  }
};

/* ---------- bộ chạy câu hỏi ---------- */

TL.runItems = function (host, items, opts = {}) {
  return new Promise(resolve => {
    let i = 0, res = { n: 0, firstOk: 0, okAfter: 0, results: [] }, badRun = 0;
    const next = () => {
      if (i >= items.length) return resolve(res);
      const it = items[i];
      renderItem(host, it, i, items.length, opts, out => {
        res.n++; if (out.first) res.firstOk++; else if (out.ok) res.okAfter++;
        res.results.push({ skill: it.skill, first: out.first });
        badRun = out.first ? 0 : badRun + 1;
        if (badRun >= 2 && opts.mode !== 'test' && !out.inserted) { // học thích ứng: giảm độ khó, giảng lại
          const sim = TL.genSimilar(it, true); sim._reteach = true; items.splice(i + 1, 0, sim); badRun = 0;

    };
    next();

};

const oldVis = TL.vis;
TL.vis = function (v) { if (v && V[v.kind]) return V[v.kind](v); return oldVis(v); };

const N = s => Number(String(s).replace(/\s/g, ''));
const nums = q => (q.match(/\d[\d ]*\d|\d/g) || []).map(N);
/* gắn hình cho một câu hỏi Toán chưa có hình */
TL.autoVis = function (it) {
  if (!it || it.vis || !it.skill || !/^m\./.test(it.skill) || it.type === 'order' && it.skill !== 'm.cmp') return null;
  const q = it.q || '', n = nums(q), sk = it.skill; let m;

    if ((sk === 'm.read' || sk === 'm.place') && (m = q.match(/Số (\d{3})/))) return { kind: 'blocks', n: +m[1] };

    if (sk === 'm.seq') {

      if ((m = q.match(/:\s*([\d?, ]+)$/))) return { kind: 'nline', nums: m[1].split(',').map(x => x.trim()).map(x => x === '?' ? '?' : +x) };

    if ((m = q.match(/Đặt tính rồi tính: (\d+) ([+\-×]) (\d+)/))) return { kind: 'colq', a: +m[1], b: +m[3], op: m[2] };
    if ((m = q.match(/Đặt tính rồi tính: (\d+) : (\d+)/))) return { kind: 'divq', a: +m[1], b: +m[2] };
    if (sk === 'm.divrem' && (m = q.match(/^(\d+) : (\d)/)) && +m[1] <= 60) return { kind: 'share', n: +m[1], d: +m[2] };
    if (sk === 'm.t2' || sk === 'm.t3' || sk === 'm.t4' || sk === 'm.t5' || sk === 'm.t6' || sk === 'm.t7' || sk === 'm.t8' || sk === 'm.t9') {
      if ((m = q.match(/^(\d+) : (\d)/)) && +m[1] <= 60) return { kind: 'share', n: +m[1], d: +m[2] };
      if ((m = q.match(/Đếm thêm (\d+)\. Tìm số còn thiếu: (.+)$/))) return { kind: 'nline', nums: m[2].split(',').map(x => x.trim()).map(x => x === '?' ? '?' : +x), hop: '+' + m[1] };
    }
    if (sk === 'm.logic' && (m = q.match(/còn thiếu: (.+)$/))) return { kind: 'nline', nums: m[1].split(',').map(x => x.trim()).map(x => x === '?' ? '?' : +x) };
    if (sk === 'm.findadd' && (m = q.match(/^(\?|\d+) \+ (\?|\d+) = (\d+)/))) { const tot = +m[3], known = m[1] === '?' ? +m[2] : +m[1]; return { kind: 'bars', max: tot, rows: [{ name: 'Tổng', total: String(tot), parts: [{ w: known, label: known, col: C.blue }, { w: Math.max(tot - known, tot * .15), label: '?', col: C.orange }] }] }; }
    if (sk === 'm.findadd' && (m = q.match(/tất cả (\d+).*?thứ nhất có (\d+)/))) { const tot = +m[1], a = +m[2]; return { kind: 'bars', max: tot, rows: [{ name: 'Cả hai', total: String(tot), parts: [{ w: a, label: a, col: C.blue }, { w: tot - a, label: '?', col: C.orange }] }] }; }
    if (sk === 'm.findsub' && (m = q.match(/^(\?|\d+) - (\?|\d+) = (\d+)/))) { const a = m[1], b = m[2], h = +m[3]; const tot = a === '?' ? +b + h : +a; return { kind: 'bars', max: tot, rows: [{ name: 'Số bị trừ', total: a === '?' ? '?' : String(tot), parts: [{ w: a === '?' ? +b : (b === '?' ? tot - h : +b), label: b === '?' ? '?' : b, col: C.red }, { w: h, label: h, col: C.green }] }] }; }
    if (sk === 'm.findmul' && (m = q.match(/^(\?|\d+) × (\?|\d+) = (\d+)/))) { const k = m[1] === '?' ? +m[2] : +m[1]; return { kind: 'share', n: Math.min(+m[3], 60), d: k }; }
    if (sk === 'm.word1' && (m = q.match(/(nhiều hơn|ít hơn|nặng hơn)/)) && n.length >= 2) { const a = n[0], d = n[1]; const more = m[1] === 'nhiều hơn'; if (m[1] === 'nặng hơn') return { kind: 'bars', max: Math.max(a, d), rows: [{ name: 'Thứ nhất', parts: [{ w: a, label: a, col: C.blue }] }, { name: 'Thứ hai', parts: [{ w: d, label: d, col: C.green }] }] };
      const b = more ? a + d : a - d; return { kind: 'bars', max: Math.max(a, b), rows: [{ name: 'Thứ nhất', parts: [{ w: a, label: a, col: C.blue }] }, { name: 'Thứ hai', parts: more ? [{ w: a, label: a, col: C.green }, { w: d, label: '+' + d, col: C.orange }] : [{ w: b, label: '?', col: C.green }] }] }; }
    if (sk === 'm.gaplen' && n.length >= 2) { const a = n[n.length >= 3 ? n.length - 2 : 0], k = n[n.length - 1] <= 10 ? n[n.length - 1] : n[1]; if (k >= 2 && k <= 10) return { kind: 'bars', max: a * k, rows: [{ name: 'Số đã cho', parts: [{ w: a, label: a, col: C.blue }] }, { name: 'Gấp ' + k + ' lần', total: '?', parts: Array.from({ length: k }, () => ({ w: a, label: a, col: C.green })) }] }; }
    if (sk === 'm.giam' && n.length >= 2) { const a = n[0], k = n[1]; if (k >= 2 && k <= 10 && a % k === 0) return { kind: 'bars', max: a, rows: [{ name: 'Lúc đầu', total: String(a), parts: Array.from({ length: k }, (_, i) => ({ w: a / k, label: i ? '' : '?', col: i ? '#93C5FD' : C.orange })) }] }; }
    if (sk === 'm.gapmay' && n.length >= 2) { const a = n[0], b = n[1]; return { kind: 'bars', max: a, rows: [{ name: 'Số lớn', parts: [{ w: a, label: a, col: C.blue }] }, { name: 'Số bé', parts: [{ w: b, label: b, col: C.orange }] }] }; }
    if (sk === 'm.mul21' && (m = q.match(/Mỗi (.+?) có (\d+) (.+?)\. Hỏi (\d+)/))) { const a = +m[2], k = +m[4]; return { kind: 'bars', max: a * k, rows: [{ name: k + ' ' + m[1], total: '?', parts: Array.from({ length: k }, () => ({ w: a, label: a, col: C.teal })) }] }; }
    if (sk === 'm.trungdiem') { if ((m = q.match(/AB dài (\d+)/))) return { kind: 'seg', am: '?', mb: '?' }; if ((m = q.match(/AM dài (\d+)/))) return { kind: 'seg', am: m[1] + ' cm', mb: '?' }; return { kind: 'seg', am: '', mb: '' }; }

    if (sk === 'm.frac' && (m = q.match(/^Chia (\d+) (.+?) thành (\d+) phần/)) && +m[1] <= 60) return { kind: 'share', n: +m[1], d: +m[3] };
    if (sk === 'm.geo' && (m = q.match(/lần lượt (.+?)\. Tính/))) return { kind: 'poly2', seg: m[1].split(', ') };
    if (sk === 'm.geo' && (m = q.match(/gồm (\d+) đoạn thẳng, mỗi đoạn dài (\d+) cm/)) && +m[1] <= 6) return { kind: 'poly2', seg: Array.from({ length: +m[1] }, () => m[2] + ' cm') };
    if ((sk === 'm.phieu24' || sk === 'm.gaplen') && (m = q.match(/Gấp số (\d+) lên (\d+) lần/))) { const a = +m[1], k = +m[2]; return { kind: 'bars', max: a * k, rows: [{ name: 'Số ' + a, parts: [{ w: a, label: a, col: C.blue }] }, { name: 'Gấp ' + k + ' lần', total: '?', parts: Array.from({ length: k }, () => ({ w: a, label: a, col: C.green })) }] }; }
    if (sk === 'm.twostep' && (m = q.match(/^\D*?(\d+)\D*?(nhiều hơn|ít hơn|nhẹ hơn|nặng hơn)\D*?(\d+)/))) { const a = +m[1], d = +m[3], more = /nhiều|nặng/.test(m[2]); if (!more && d >= a) return null; const b = more ? a + d : a - d; return { kind: 'bars', max: Math.max(a, b), rows: [{ name: 'Thứ nhất', parts: [{ w: a, label: a, col: C.blue }] }, { name: 'Thứ hai', parts: more ? [{ w: a, label: a, col: C.green }, { w: d, label: '+' + d, col: C.orange }] : [{ w: b, label: '?', col: C.green }, { w: d, label: d, col: '#CBD5E1' }] }] }; }
    if (sk === 'm.hinhtron') return { kind: 'circle' };
    if (sk === 'm.goc' && (m = q.match(/Lúc (\d+) giờ/))) return { kind: 'clock', h: +m[1], m: 0 };
    if (sk === 'm.hinhphang') { const k = /tam giác/.test(q) ? 'tamgiac' : /vuông/.test(q) && !/chữ nhật/.test(q) ? 'vuong' : /tứ giác/.test(q) ? 'tugiac' : 'chunhat'; return { kind: 'shape', k }; }
    if (sk === 'm.khoi') return { kind: 'solid', k: /lập phương/.test(q) ? 'lapphuong' : 'hop' };
    if (sk === 'm.mm') return { kind: 'ruler', cm: 6 };
    if (sk === 'm.ml') { if ((m = q.match(/Rót đều (\d+) ml nước vào (\d)/))) return { kind: 'jug', levels: Array.from({ length: +m[2] }, () => ({ ml: null, label: '? ml' })) }; if ((m = q.match(/(\d+) ml ([+-]) (\d+) ml/))) return { kind: 'jug', levels: [{ ml: +m[1], label: m[1] + ' ml' }, { ml: +m[3], label: m[3] + ' ml' }] }; return { kind: 'jug', levels: [{ ml: 1000, label: '1 l' }] }; }

  } catch (e) { return null; }
  return null;
};

/* ---------- khu vui chơi ---------- */
SCREENS.play = function (m) {
  if (!playUnlocked()) { m.innerHTML = '<div class="card"><h2>' + TL.ICON.lock + ' Khu vui chơi chưa mở</h2><p>Khu vui chơi mở khi đến phần Trò chơi củng cố trong lịch học, hoặc khi con xong nhiệm vụ hôm nay.</p><button class="btn" data-go="home" style="margin-top:12px">Về trang chủ</button></div>'; return; }
  const learned = TL.learnedSkills().filter(s => !TL.skills[s].reading && !TL.skills[s].kc);
  const pool = learned.length ? learned : ['m.t2', 'm.t5', 'tv.ck', 'tv.svhd'];
  const levels = S().gameLv || (S().gameLv = {});
  m.innerHTML = '<div class="row"><button class="btn small ghost" data-go="home">Về trang chủ</button></div><h1 style="margin:8px 0">Khu vui chơi</h1><p class="muted">Nội dung trò chơi lấy từ các bài con đã học' + (learned.length ? '' : ' (con chưa học bài nào nên Cú Bon chọn bài đầu tiên)') + '. Thắng một trò, cấp độ trò đó tăng lên.</p><div class="grid3" style="margin-top:14px" id="glist"></div><div id="gstage" style="margin-top:16px"></div>';
  Object.keys(TL.GAMES).forEach(k => { const g = TL.GAMES[k]; const lv = levels[k] || 1;
    const c = el('<div class="card"><h3>' + esc(g.name) + '</h3><p class="small muted">' + esc(g.rule) + '</p><div class="row" style="margin-top:10px"><span class="pill">Cấp ' + lv + '</span><div class="spacer"></div><button class="btn small">Chơi</button></div></div>');
    $('.btn', c).onclick = () => startGame(k); $('#glist', m).appendChild(c); });
  async function startGame(k) {
    const lv = levels[k] || 1; const stage = $('#gstage', m); $('#glist', m).hidden = true; screen.subj = null;
    const data = makeGame(k, pool, lv);
    const r = await TL.playGame(stage, data, { level: lv, doneLabel: 'Về Khu vui chơi' });
    if (r.max && r.score >= r.max * .7) levels[k] = Math.min(3, lv + 1); TL.save();
    if (r.again) return startGame(k);
    TL.go('play');
  }
};
function makeGame(k, pool, lv) {
  const tv = pool.filter(s => s.startsWith('tv.')), ma = pool.filter(s => s.startsWith('m.'));
  if (k === 'pairs') { if (ma.length && (!tv.length || Math.random() < .5)) { const ns = ma.filter(s => /^m\.t\d$/.test(s)).map(s => +s.slice(3)); const N = ns.length ? ns : [2, 5]; const used = new Set(), pairs = []; while (pairs.length < 3 + lv) { const n = TL.pick(N), x = TL.R(2, lv === 1 ? 5 : 9); if (used.has(n * x)) continue; used.add(n * x); pairs.push([n + ' × ' + x, String(n * x)]); } return { type: 'pairs', title: 'Ghép phép tính với kết quả', pairs }; }
    return TL.games.tvFree(); }
  if (k === 'pop') { const l = TL.lessons.filter(x => pool.some(s => x.skills.includes(s))); for (const x of TL.shuffle(l)) { const g = x.game(); if (g.type === 'pop') return g; } return TL.lessons.find(x => x.id === 'm02').game(); }
  if (k === 'sort') { const l = TL.lessons.filter(x => pool.some(s => x.skills.includes(s))); for (const x of TL.shuffle(l)) { const g = x.game(); if (g.type === 'sort') return g; } return TL.lessons.find(x => x.id === 'v02').game(); }
  if (k === 'race') return { type: 'race', skills: TL.shuffle(pool).slice(0, 4) };
  if (k === 'wheel') return { type: 'wheel', skills: TL.shuffle(pool).slice(0, 6) };
  const items = []; const ord = pool.filter(s => TL.skills[s].bank && TL.skills[s].bank.some(b => b.type === 'order'));
  for (let i = 0; i < 2 + lv; i++) items.push(ord.length && Math.random() < .5 ? TL.genItem(TL.pick(ord)) : TL.genItem('m.cmp', 3));
  items.forEach(it => { if (it.type !== 'order') { const ns = TL.shuffle([TL.R(100, 999), TL.R(100, 999), TL.R(100, 999), TL.R(100, 999)]).filter((v, i, a) => a.indexOf(v) === i); const sorted = ns.slice().sort((a, b) => a - b).map(String); Object.assign(it, { type: 'order', q: 'Xếp các số từ bé đến lớn:', items: TL.shuffle(sorted), answer: sorted, hint: 'So sánh hàng trăm trước.', solution: [sorted.join(' < ')], skill: 'm.cmp' }); } });
  return { type: 'puzzle', items };
}
TL.makeGame = makeGame;

  };

SCREENS.plan = function (m) {

  const draw = () => {
    const seg = p.segs[p.idx];
    m.innerHTML = '<div class="row"><button class="btn small ghost" data-go="home">Về trang chủ</button></div><h1 style="margin:8px 0">Lịch học hôm nay</h1><p class="muted">Tổng ' + total + ' phút, có nghỉ giải lao. Một việc tại một thời điểm.</p>' +

      '<div class="seg">' + p.segs.map((s, i) => '<i class="' + (s.done ? 'done' : i === p.idx ? 'now' : '') + '" title="' + esc(s.name) + '"></i>').join('') + '</div>' +
      (p.allDone ? '' : '<div class="row" style="justify-content:center;margin-top:14px">' + (!p.running ? '<button class="btn big" data-a="start">Bắt đầu buổi học</button>' : p.paused ? '<button class="btn big" data-a="resume">Học tiếp</button>' : '<button class="btn big ghost" data-a="pause">Tạm dừng</button><button class="btn big ghost" data-a="tired">Con mệt rồi</button>') + (p.running ? '<button class="btn ghost" data-a="skip">Xong phần này</button>' : '') + '<button class="btn" data-a="goto">Đi tới phần đang học</button></div>') + '</div>' +

    $$('[data-a]', m).forEach(b => b.onclick = () => act(b.dataset.a));
  };
  const act = a => {
    if (a === 'start') { p.running = true; p.paused = false; lastAct = Date.now(); }
    if (a === 'resume') { p.paused = false; lastAct = Date.now(); }
    if (a === 'pause') p.paused = true;
    if (a === 'tired') { p.paused = true; TL.save(); const o = overlay('<div class="col" style="align-items:center;text-align:center">' + TL.owl(90) + '<h2>Nghỉ ngơi thôi</h2><p>Con mệt thì mình dừng lại một chút. Uống nước, vươn vai, hoặc nghỉ hẳn hôm nay cũng được. Cú Bon không trừ sao đâu.</p><button class="btn" data-x>Được ạ</button></div>'); $('[data-x]', o).onclick = () => { o.remove(); TL.go('home'); }; return; }
    if (a === 'skip') { advance(); }
    if (a === 'goto') { const s = p.segs[p.idx]; if (!p.running) { p.running = true; p.paused = false; } TL.save(); if (s.kind === 'tv' || s.kind === 'toan') return TL.go('kingdom', { arg: s.kind }); if (s.kind === 'game') return TL.go('play'); if (s.kind === 'warm') return TL.go(TL.learnedSkills().length ? 'review' : (S().placementDone ? 'kingdom' : 'placement'), { arg: 'tv' }); if (s.kind === 'sum') return TL.go('summary'); if (s.kind === 'break') return showBreak(); }
    TL.save(); draw();

  const iv = setInterval(() => { if (screen.name !== 'plan') return clearInterval(iv); const c = $('.big-clock', m); if (c) c.textContent = mmss(p.segs[p.idx].left); }, 1000);
};

}

TL.importPack = function (txt) {
  let pk; try { pk = JSON.parse(txt); } catch (e) { return { ok: false, msg: 'Nội dung không phải JSON hợp lệ: ' + e.message }; }
  const errs = [];
  if (!pk || !pk.pack) errs.push('Thiếu tên gói ("pack").');
  if (!['toan', 'tv'].includes(pk && pk.subject)) errs.push('"subject" phải là "toan" hoặc "tv".');
  if (!pk || !Array.isArray(pk.lessons) || !pk.lessons.length) errs.push('Thiếu danh sách bài ("lessons").');
  (pk && pk.lessons || []).forEach((l, i) => {
    const w = 'Bài thứ ' + (i + 1) + ': ';
    if (!l.id || !/^[a-z0-9-]+$/.test(l.id)) errs.push(w + '"id" chỉ gồm chữ thường không dấu, số, gạch nối.');
    if (TL.lessons.some(x => x.id === 'pk-' + l.id) || TL.S.packs.some(p => p.lessons.some(x => x.id === l.id))) errs.push(w + 'id "' + l.id + '" đã có.');
    if (!l.title) errs.push(w + 'thiếu "title".');
    if (!Array.isArray(l.items) || !l.items.length) errs.push(w + 'thiếu "items".');
    (l.items || []).forEach((it, j) => { const ww = w + 'câu ' + (j + 1) + ': ';
      if (!['mcq', 'num', 'multi', 'order'].includes(it.type)) errs.push(ww + 'dạng câu không hỗ trợ.');
      if (!it.q) errs.push(ww + 'thiếu đề "q".');
      if (it.type === 'mcq' && !(Array.isArray(it.choices) && it.choices.map(String).includes(String(it.answer)))) errs.push(ww + 'đáp án phải nằm trong "choices".');
      if (it.type === 'multi' && !(Array.isArray(it.answer) && it.answer.every(a => (it.choices || []).includes(a)))) errs.push(ww + '"answer" phải là mảng con của "choices".');
      if (it.type === 'num' && typeof it.answer !== 'number') errs.push(ww + '"answer" phải là số.');
      if (it.type === 'order' && !(Array.isArray(it.answer) && it.answer.length >= 2)) errs.push(ww + '"answer" phải là mảng từ 2 mục.'); });
  });
  if (errs.length) return { ok: false, msg: 'Chưa nhập. ' + errs.slice(0, 6).join(' ') };
  TL.S.packs.push(pk); TL.save(); TL.loadPack(pk);
  return { ok: true, msg: 'Đã nhập ' + pk.lessons.length + ' bài vào vùng "Bài của lớp".' };
};
TL.loadPack = function (pk) {
  const rid = 'pack-' + pk.subject;
  if (!TL.regions.find(r => r.id === rid)) TL.regions.push({ id: rid, subject: pk.subject, name: 'Bài của lớp', desc: 'Bài do phụ huynh nhập (phiếu bài tập, sách bài tập)', color: pk.subject === 'toan' ? '#9A3412' : '#0B7285' });
  pk.lessons.forEach(l => {
    const sid = 'pk.' + l.id;
    TL.skills[sid] = { name: l.title, subj: pk.subject, cat: pk.subject === 'toan' ? 'phep' : 'tucau', tip: l.explore || '', bank: l.items.map(it => Object.assign({ hint: 'Đọc kĩ đề bài.', solution: ['Đáp án: ' + (Array.isArray(it.answer) ? it.answer.join(', ') : it.answer)] }, it, { choices: it.choices ? it.choices.map(String) : undefined })) };
    TL.lessons.push({ id: 'pk-' + l.id, subject: pk.subject, no: l.no || '*', page: l.page || '-', title: l.title, region: rid, level: 'practice', verified: false, book: 'Gói "' + pk.pack + '"', skills: [sid], explore: l.explore || 'Bài do bố mẹ nhập từ phiếu bài tập.', practice: [sid], self: [sid], memory: [sid],
      game: () => ({ type: 'race', skills: [sid] }) });
  });
};

/* ---- src/engine/restore.js ---- */
/* ===== Điểm quay lại và chế độ bố mẹ học thử =====
   Trước những việc quan trọng (bài khởi hành, bắt đầu một bài mới, đầu mỗi ngày), ứng dụng chụp lại tiến độ học
   vào bộ nhớ trình duyệt (12 điểm gần nhất). Bố mẹ lỡ tay làm bài thay con thì vào Khu phụ huynh để quay lại.
   Chế độ "Bố mẹ học thử": mọi kết quả trong lúc thử bị bỏ khi bấm Kết thúc thử. */
(function () {
'use strict';
const PK = 'tulinh.points', TK = 'tulinh.trial', MAX = 12;
const KEEP = ['settings', 'chat', 'packs', 'readings', 'syncedAt'];
function load() { try { return JSON.parse(localStorage.getItem(PK) || '[]'); } catch (e) { return []; } }
function store(arr) { while (arr.length) { try { localStorage.setItem(PK, JSON.stringify(arr)); return true; } catch (e) { arr.shift(); } } return false; }
function snap() { const o = {}; Object.keys(TL.S).forEach(k => { if (!KEEP.includes(k)) o[k] = TL.S[k]; }); return JSON.stringify(o); }
TL.points = load;
TL.restorePoint = function (label) {
  if (TL.trialOn()) return;
  const arr = load(); const last = arr[arr.length - 1];
  if (last && last.label === label && Date.now() - last.t < 10 * 60 * 1000) return;
  arr.push({ t: Date.now(), label, data: snap() }); if (arr.length > MAX) arr.splice(0, arr.length - MAX); store(arr);
};
TL.restoreTo = function (t) {
  const p = load().find(x => x.t === t); if (!p) return false;
  const keep = {}; KEEP.forEach(k => keep[k] = TL.S[k]);
  TL.S = Object.assign(JSON.parse(p.data), keep); TL.normalize();
  TL.forcePush = true; TL.ensureDaily(); TL.ensureWeekly(); TL.ensurePlan(); TL.save(); if (TL.syncNow) TL.syncNow();
  return true;
};
TL.trialOn = () => { try { return !!localStorage.getItem(TK); } catch (e) { return false; } };
TL.startTrial = function () {
  TL.restorePoint('Trước khi bố mẹ học thử'); const p = load().pop();
  try { localStorage.setItem(TK, String(p ? p.t : Date.now())); } catch (e) { }
  bar(); TL.go('home'); TL.toast('Bố mẹ đang học thử. Kết quả sẽ không được giữ lại.');
};
TL.endTrial = function () {
  let t = 0; try { t = Number(localStorage.getItem(TK)); localStorage.removeItem(TK); } catch (e) { }
  TL.restoreTo(t); bar(); TL.go('home'); TL.toast('Đã bỏ toàn bộ kết quả học thử. Tiến độ của con như trước khi thử.');
};
function bar() {
  let b = document.getElementById('trialbar');
  if (!TL.trialOn()) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('div'); b.id = 'trialbar'; b.innerHTML = '<span>Bố mẹ đang học thử: kết quả không được lưu cho con.</span><button class="btn small">Kết thúc thử</button>'; document.body.prepend(b); b.querySelector('button').onclick = TL.endTrial; }
}
TL.trialBar = bar;
bar();
TL.restorePoint('Đầu ngày ' + TL.viDate(TL.today()));
})();

  $('[data-x]', p).onclick = toggle;
  $('#cubon-mic', p).onclick = listen;
  const vo = $('[data-vo]', p), tk = $('[data-talk]', p); vo.checked = !!S().settings.chatVoice; tk.checked = talkMode;
  vo.onchange = () => { S().settings.chatVoice = vo.checked; TL.save(); if (!vo.checked) try { speechSynthesis.cancel(); } catch (e) { } };
  tk.onchange = () => { talkMode = tk.checked; if (talkMode) { if (!SR) { tk.checked = talkMode = false; TL.toast('Trình duyệt này chưa nghe được giọng nói. Con dùng Chrome hoặc Edge nhé.'); return; } listen(); } else { try { rec && rec.stop(); } catch (e) { } try { speechSynthesis.cancel(); } catch (e) { } setMic(false); } };
  if (!SR) { $('#cubon-mic', p).title = 'Trình duyệt này chưa hỗ trợ nghe giọng nói'; }
  const q = $('.quick', p);
  ['Con chưa hiểu bài này', 'Gợi ý cho con câu này', 'Giảng lại bằng ví dụ khác', 'Con nên ôn gì hôm nay?'].forEach(t => { const b = el('<button class="tok small"></button>'); b.textContent = t; b.onclick = () => send(t); q.appendChild(b); });
  $('form', p).onsubmit = e => { e.preventDefault(); const i = $('#cubon-in', p); const v = i.value.trim(); if (v) { i.value = ''; send(v); } };
  draw();
  TL.AI.ready.then(ok => { if (!ok) $('.note-ai', p).textContent = 'Cú Bon chưa trò chuyện được: ' + TL.AI.reason + ' Con nhờ bố mẹ giúp nhé.'; });
  setTimeout(() => $('#cubon-in', p).focus(), 50);
}
function recent() { return S().chat.filter(m => m.d === TL.today()).slice(-12); }
function draw(streaming) {
  const box = $('#cubon-panel .msgs'); if (!box) return;
  const msgs = recent();
  box.innerHTML = (msgs.length ? '' : '<div class="msg bot">Chào ' + TL.kid() + '! Cú Bon ở đây. Con chưa hiểu chỗ nào thì hỏi Cú Bon nhé. Cú Bon sẽ gợi ý để con tự làm.</div>') +
    msgs.map(m => '<div class="msg ' + (m.r === 'u' ? 'me' : 'bot') + '">' + esc(m.t) + '</div>').join('') + (streaming != null ? '<div class="msg bot">' + esc(streaming || 'Cú Bon đang nghĩ...') + '</div>' : '');
  box.scrollTop = box.scrollHeight;
}
async function send(text, byVoice) {
  if (busy) return;
  if (!(await TL.AI.ready)) { TL.toast('Cú Bon chưa trò chuyện được. ' + TL.AI.reason); return; }
  if (todayCount() >= MAXDAY()) { S().chat.push({ d: TL.today(), r: 'b', t: 'Hôm nay con đã hỏi nhiều rồi. Con thử tự nghĩ, hoặc hỏi bố mẹ nhé. Mai mình nói chuyện tiếp.' }); TL.save(); draw(); return; }
  busy = true; const ctx = context();
  S().chat.push({ d: TL.today(), r: 'u', t: text, ctx: ctx.slice(0, 160), v: byVoice ? 1 : 0 }); TL.save(); draw('');
  const hist = recent();
  const turns = hist.slice(0, -1).map(m => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
  while (turns.length && turns[0].role !== 'user') turns.shift();
  const first = RULES + '\n\n';
  const last = '[Ngữ cảnh lúc này: ' + (ctx || 'Bé đang ở trang chủ.') + ']\n' + TL.kid() + ' nói: ' + text;
  if (turns.length) turns[0] = { role: 'user', content: first + turns[0].content };
  turns.push({ role: 'user', content: (turns.length ? '' : first) + last });
  // gộp các lượt cùng vai liền nhau
  const merged = []; turns.forEach(t => { const p = merged[merged.length - 1]; if (p && p.role === t.role) p.content += '\n' + t.content; else merged.push(Object.assign({}, t)); });
  ctl = new AbortController();
  try {
    const r = await TL.AI.chat(merged, t => draw(t), ctl.signal);
    S().chat.push({ d: TL.today(), r: 'b', t: r.trim() });
    if (byVoice || talkMode || S().settings.chatVoice) sayReply(r.trim());
  } catch (e) { if (e && e.code !== 'cancelled') S().chat.push({ d: TL.today(), r: 'b', t: e.message || 'Cú Bon chưa trả lời được. Con thử lại sau nhé.' }); }
  if (S().chat.length > 200) S().chat.splice(0, S().chat.length - 200);
  TL.save(); busy = false; draw();
}
})();

/* ---- src/engine/sync.js ---- */
/* ===== Đồng bộ tiến độ lên máy chủ Apps Script (chỉ chạy ở bản Google Apps Script) =====
   Trình duyệt vẫn lưu bản chính trong localStorage. Mỗi lần lưu, sau 4 giây yên lặng sẽ đẩy một bản lên máy chủ.
   Lúc mở ứng dụng, tải bản trên máy chủ về; bản nào mới hơn (updatedAt lớn hơn) thì dùng bản đó. */
(function () {
'use strict';
if (!TL.gas) return;
let timer = null, pushing = false, again = false, lastOk = 0, lastErr = '', ready = false;
function push() {
  if (TL.trialOn && TL.trialOn()) return;
  if (!ready) return; // chưa đọc xong bản trên máy chủ thì không được đẩy lên, tránh ghi đè tiến độ bằng dữ liệu trống
  if (pushing) { again = true; return; }
  pushing = true;
  const force = !!TL.forcePush;
  TL.gasCall('saveState', { json: JSON.stringify(TL.S), force }).then(r => {
    lastOk = Date.now(); lastErr = r && r.error ? r.error : '';
    if (!lastErr) { if (force) TL.forcePush = false; markSynced(r && r.upd); }
    else if (r.error === 'conflict' || r.error === 'stale') reloadRemote(); // máy khác vừa lưu bản mới hơn: lấy bản đó về
  }).catch(e => { lastErr = e.message || 'lỗi mạng'; })
    .then(() => { pushing = false; if (again) { again = false; push(); } });
}
TL.onSave = function () { clearTimeout(timer); timer = setTimeout(push, 4000); };
TL.syncNow = function () { clearTimeout(timer); push(); };
TL.syncInfo = function () { return lastOk ? 'Lần đồng bộ gần nhất: ' + new Date(lastOk).toLocaleTimeString('vi-VN') + '.' : lastErr ? 'Chưa đồng bộ được: ' + lastErr + '.' : 'Đang chờ đồng bộ lần đầu.'; };
addEventListener('pagehide', () => TL.syncNow());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') TL.syncNow(); });
function markSynced(upd) { TL.S.syncedAt = upd || TL.S.updatedAt || Date.now(); try { localStorage.setItem(TL.KEY, JSON.stringify(TL.S)); } catch (e) { } }
function adopt(remote) {
  TL.S = remote; TL.normalize && TL.normalize();
  TL.S.syncedAt = TL.S.updatedAt;
  try { localStorage.setItem(TL.KEY, JSON.stringify(TL.S)); } catch (e) { }
  (TL.S.packs || []).forEach(pk => { try { TL.loadPack(pk); } catch (e) { } });
  TL.ensureDaily(); TL.ensureWeekly(); TL.ensurePlan();
  const sc = TL.screen(); if (sc.name === 'home' || sc.name === 'kingdom') TL.go(sc.name, sc.arg ? { arg: sc.arg } : undefined);
  TL.toast('Đã tải tiến độ học mới nhất.');
}
/* Quy tắc gộp:
   - Máy chưa từng đồng bộ (mới mở lần đầu, hoặc trình duyệt bị xoá dữ liệu): luôn lấy bản trên máy chủ.
   - Máy đã từng đồng bộ: bản máy chủ được cập nhật sau lần đồng bộ cuối của máy này thì lấy bản máy chủ;
     ngược lại, máy này có thay đổi mới thì đẩy lên. */
function reloadRemote() { TL.gasCall('loadState').then(raw => { try { const r = JSON.parse(raw); if (r) adopt(r); } catch (e) { } }).catch(() => { }); }
TL.syncReady = TL.gasCall('loadState').then(raw => {
  let remote = null; if (raw) { try { remote = JSON.parse(raw); } catch (e) { remote = null; } }
  ready = true;
  if (!remote) { push(); return; }
  if (TL.forcePush) { push(); return; } // bố mẹ vừa quay lại điểm cũ: bản trên máy này là bản đúng
  const synced = TL.S.syncedAt || 0;
  if (!synced || (remote.updatedAt || 0) > synced) adopt(remote);
  else if ((TL.S.updatedAt || 0) > synced) push();
}).catch(e => { lastErr = e.message || 'lỗi mạng'; });
})();

/* ---- src/engine/main.js ---- */
/* ===== Khởi động ứng dụng ===== */
(function () {
'use strict';
// Mặc định luôn dùng giao diện sáng, tươi vui cho trẻ; chỉ dùng nền tối khi bố mẹ chọn trong Khu phụ huynh
document.documentElement.dataset.theme = 'light';
try { if (localStorage.getItem('tulinh.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) { }
(TL.S.packs || []).forEach(pk => { try { TL.loadPack(pk); } catch (e) { console.warn('Gói lỗi', e); } });
TL.ensureDaily(); TL.ensureWeekly(); TL.ensurePlan();
TL.go('home');
TL.AI.ready.then(() => { if (TL.screen().name === 'parent') TL.go('parent', { arg: 'data' }); });
addEventListener('beforeunload', () => TL.save());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') TL.save(); });
})();

</script>
